<script type="application/ld+json">

  <style>
    :root {
      --fs: 18px; 
      --paper: #fff9c4;      
      --paper-lines: rgba(0,0,0,0.08);
      --paper-margin: #0025bb; 
    }

    * { box-sizing: border-box; }
    html, body { 
      height: 100%; 
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      overflow: hidden;
    }

    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1rem;
      color: #444;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.7);
      border-bottom: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .editors-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-pane {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 200px;
      overflow: hidden;
    }

    .editor-pane:first-child {
      flex-basis: 50%;
    }

    .editor-pane:last-child {
      flex: 1;
      min-width: 200px;
    }

    /* Resizable divider */
    .divider {
      width: 8px;
      background: transparent;
      cursor: col-resize;
      position: relative;
      flex-shrink: 0;
      z-index: 10;
      transition: background 0.2s ease;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(0, 0, 0, 0.15);
      transform: translateX(-50%);
      transition: background 0.2s ease;
    }

    .divider:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    .divider:hover::before {
      background: rgba(0, 0, 0, 0.3);
      width: 3px;
    }

    .divider.dragging {
      background: rgba(0, 0, 0, 0.03);
    }

    .divider.dragging::before {
      background: rgba(0, 0, 0, 0.4);
      width: 3px;
    }

    /* Remove old border */
    .editor-pane + .editor-pane {
      border-left: none;
    }

    .editor {
      flex: 1;
      width: 100%;
      height: 100%;
      padding: 16px 2rem 3.5rem 2rem; 
      outline: none;
      border-radius: 0;
      box-shadow: none;
      overflow-y: auto;

      background:
        repeating-linear-gradient(
          to bottom,
          var(--paper) 0 15px,
          var(--paper-lines) 16px,
          var(--paper) 17px 32px
        );
      color: #1a1a1a;
      font-size: var(--fs);
      line-height: 32px; /* matches the paper line spacing */
    }

    /* Highlight style (used if execCommand hiliteColor is unavailable) */
    mark, .hl { background: #ffec66; padding: 0 .05em; border-radius: 3px; }

    /* Image styles */
    .editor img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 8px 0;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    /* Checkbox styles - minimal and larger */
    .editor input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 5px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      border: 2px solid #666;
      border-radius: 4px;
      background: transparent;
      vertical-align: middle;
      position: relative;
      transition: all 0.2s ease;
    }

    .editor input[type="checkbox"]:hover {
      border-color: #333;
    }

    .editor input[type="checkbox"]:checked {
      background: #000;
      border-color: #000;
    }

    /* Page switcher */
    .page-switcher {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.01rem;
      z-index: 100;
    }

    .page-btn {
      width: 19px;
      height: 19px;
      border: none;
      background: transparent;
      color: #444;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .page-btn:hover {
      color: #222;
    }

    .page-btn.active {
      font-weight: 700;
      text-decoration: underline;
    }

    footer {
      display: none;
    }

    /* Custom scrollbar - minimal and less distracting */
    /* WebKit browsers (Chrome, Safari, Edge) */
    .editor::-webkit-scrollbar {
      width: 2px;
    }

    .editor::-webkit-scrollbar-track {
      background: transparent;
    }

    .editor::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 2px;
    }

    .editor::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    /* Firefox */
    .editor {
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.15) transparent;
    }

    /* Mobile view - stack vertically and reduce left margin */
    @media (max-width: 768px) {
      .editors-container {
        flex-direction: column;
      }

      .divider {
        display: none;
      }

      .editor-pane {
        flex: 1 !important;
        flex-basis: auto !important;
        min-width: 0 !important;
      }

      .editor-pane + .editor-pane {
        border-top: 2px solid rgba(0, 0, 0, 0.15);
      }

      .editor {
        padding-left: 1rem;
        background:
          repeating-linear-gradient(
            to bottom,
            var(--paper) 0 15px,
            var(--paper-lines) 16px,
            var(--paper) 17px 32px
          );
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="editors-container">
      <!-- Left Pane -->
      <div class="editor-pane" id="left-pane">
        <div id="editor-left" class="editor" contenteditable="true" spellcheck="false" aria-label="Left note editor"></div>
      </div>

      <!-- Draggable Divider -->
      <div class="divider" id="divider"></div>

      <!-- Right Pane -->
      <div class="editor-pane" id="right-pane">
        <div id="editor-right" class="editor" contenteditable="true" spellcheck="false" aria-label="Right note editor"></div>
      </div>
    </div>
  </div>

  <!--  Thank you for using Notepad, here to provide the most minimalistic experience <3 -->
  <!--  Smile and enjoy your day  :< -> :>   -->
  
  <!-- Global Page Switcher -->
  <div class="page-switcher">
    <button class="page-btn active" data-page="1">1</button>
    <button class="page-btn" data-page="2">2</button>
  </div>

  <script>
    (function() {
      const editorLeft = document.getElementById('editor-left');
      const editorRight = document.getElementById('editor-right');
      const leftPane = document.getElementById('left-pane');
      const rightPane = document.getElementById('right-pane');
      const divider = document.getElementById('divider');
      const container = document.querySelector('.editors-container');
      
      const LS_KEY_PREFIX_LEFT = 'sticky-notepad-left-content-v2-page-';
      const LS_KEY_PREFIX_RIGHT = 'sticky-notepad-right-content-v2-page-';
      const LS_FS_KEY = 'sticky-notepad-fontsize-v1';
      const LS_CURRENT_PAGE = 'sticky-notepad-current-page-v2';
      const LS_SPLIT_POS = 'sticky-notepad-split-position-v1';

      let currentPage = parseInt(localStorage.getItem(LS_CURRENT_PAGE)) || 1;

      // Restore saved split position
      const savedSplit = localStorage.getItem(LS_SPLIT_POS);
      if (savedSplit) {
        leftPane.style.flexBasis = savedSplit;
      }

      // Divider drag functionality
      let isDragging = false;
      
      divider.addEventListener('mousedown', (e) => {
        isDragging = true;
        divider.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const containerRect = container.getBoundingClientRect();
        const offsetX = e.clientX - containerRect.left;
        const percentage = (offsetX / containerRect.width) * 100;
        
        // Clamp between 20% and 80% to prevent too small panes
        const clampedPercentage = Math.max(20, Math.min(80, percentage));
        leftPane.style.flexBasis = clampedPercentage + '%';
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          divider.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          
          // Save split position
          try {
            localStorage.setItem(LS_SPLIT_POS, leftPane.style.flexBasis);
          } catch (e) {}
        }
      });

      // Force contenteditable to use <br> instead of <p> for line breaks
      document.execCommand('defaultParagraphSeparator', false, 'br');

      // Load page content for both panes
      function loadPage(pageNum) {
        const savedLeft = localStorage.getItem(LS_KEY_PREFIX_LEFT + pageNum);
        const savedRight = localStorage.getItem(LS_KEY_PREFIX_RIGHT + pageNum);
        
        editorLeft.innerHTML = savedLeft !== null ? savedLeft : '';
        editorRight.innerHTML = savedRight !== null ? savedRight : '';
        
        currentPage = pageNum;
        localStorage.setItem(LS_CURRENT_PAGE, pageNum);
        
        // Update active button
        document.querySelectorAll('.page-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.page == pageNum);
        });
      }

      // Initial load
      loadPage(currentPage);

      const savedFs = localStorage.getItem(LS_FS_KEY);
      if (savedFs) document.documentElement.style.setProperty('--fs', savedFs);

      // Persist on changes (debounced for bursty inputs)
      let tLeft, tRight;
      
      const saveNow = (pane) => {
        const editor = pane === 'left' ? editorLeft : editorRight;
        const prefix = pane === 'left' ? LS_KEY_PREFIX_LEFT : LS_KEY_PREFIX_RIGHT;
        try { localStorage.setItem(prefix + currentPage, editor.innerHTML); } catch (e) {}
      };

      // Setup input handler for an editor
      function setupEditorHandlers(editor, pane) {
        editor.addEventListener('input', (e) => {
          // Check for checkbox pattern: - [ ]
          if (e.inputType === 'insertText' || e.inputType === 'insertLineBreak') {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
              const range = sel.getRangeAt(0);
              const node = range.startContainer;
              
              if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent;
                const cursorPos = range.startOffset;
                
                // Look for "- [ ]" pattern (with space after closing bracket)
                const beforeCursor = text.substring(0, cursorPos);
                const match = beforeCursor.match(/- \[ \]$/);
                
                if (match) {
                  e.preventDefault();
                  
                  // Get the position where the pattern starts
                  const patternStart = cursorPos - match[0].length;
                  
                  // Create checkbox
                  const checkbox = document.createElement('input');
                  checkbox.type = 'checkbox';
                  
                  // Add event listener to save when checkbox is toggled
                  checkbox.addEventListener('change', () => saveNow(pane));
                  
                  // Split the text node
                  const beforePattern = text.substring(0, patternStart);
                  const afterPattern = text.substring(cursorPos);
                  
                  // Create new text nodes
                  const beforeNode = document.createTextNode(beforePattern);
                  const afterNode = document.createTextNode(afterPattern);
                  
                  // Get parent and replace
                  const parent = node.parentNode;
                  parent.insertBefore(beforeNode, node);
                  parent.insertBefore(checkbox, node);
                  parent.insertBefore(afterNode, node);
                  parent.removeChild(node);
                  
                  // Set cursor after checkbox
                  const newRange = document.createRange();
                  newRange.setStart(afterNode, 0);
                  newRange.collapse(true);
                  sel.removeAllRanges();
                  sel.addRange(newRange);
                }
              }
            }
          }
          
          const timer = pane === 'left' ? tLeft : tRight;
          clearTimeout(timer);
          const newTimer = setTimeout(() => saveNow(pane), 150);
          if (pane === 'left') tLeft = newTimer;
          else tRight = newTimer;
        });
      }

      // Setup both editors
      setupEditorHandlers(editorLeft, 'left');
      setupEditorHandlers(editorRight, 'right');

      // Page switcher click handler
      document.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          saveNow('left');  // Save both panes before switching
          saveNow('right');
          loadPage(parseInt(btn.dataset.page));
        });
      });

      // Utility: change font size (in px) stored in CSS var
      function getFs() {
        const v = getComputedStyle(document.documentElement).getPropertyValue('--fs').trim();
        return parseFloat(v) || 18;
      }
      function setFs(px) {
        const clamped = Math.max(10, Math.min(48, px));
        document.documentElement.style.setProperty('--fs', clamped + 'px');
        try { localStorage.setItem(LS_FS_KEY, clamped + 'px'); } catch (e) {}
      }

      // Highlight fallback using <mark> if execCommand('hiliteColor') fails
      function highlightSelection() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
        const range = sel.getRangeAt(0);
        // Try native highlight first (still widely supported)
        const ok = document.execCommand && document.execCommand('hiliteColor', false, '#ffec66');
        if (!ok) {
          // Fallback wrap in <mark>
          try {
            const mark = document.createElement('mark');
            range.surroundContents(mark);
            sel.removeAllRanges(); sel.addRange(range);
          } catch (_) {
            // Complex ranges (spanning nodes) — fallback to simple insertion
            document.execCommand('insertHTML', false, '<mark>' + sel.toString() + '</mark>');
          }
        }
      }

      // Handle image paste from clipboard for both editors
      function setupPasteHandler(editor, pane) {
        editor.addEventListener('paste', (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;

        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          
          // Check if the item is an image
          if (item.type.indexOf('image') !== -1) {
            e.preventDefault(); // Prevent default paste behavior
            
            const blob = item.getAsFile();
            const reader = new FileReader();
            
            reader.onload = (event) => {
              const base64 = event.target.result;
              
              // Insert image at cursor position
              const img = document.createElement('img');
              img.src = base64;
              img.alt = 'Pasted image';
              
              // Insert the image
              const sel = window.getSelection();
              if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                range.deleteContents();
                range.insertNode(img);
                
                // Add a line break after image for better UX
                const br = document.createElement('br');
                range.collapse(false);
                range.insertNode(br);
                
                // Move cursor after the break
                range.setStartAfter(br);
                range.setEndAfter(br);
                sel.removeAllRanges();
                sel.addRange(range);
              } else {
                editor.appendChild(img);
                editor.appendChild(document.createElement('br'));
              }
              
              // Trigger save
              saveNow(pane);
            };
            
            reader.readAsDataURL(blob);
            break; // Only handle the first image
          }
        }
        });
      }

      setupPasteHandler(editorLeft, 'left');
      setupPasteHandler(editorRight, 'right');

      // Keyboard shortcuts - work with whichever editor has focus
      document.addEventListener('keydown', (e) => {
        const activeEl = document.activeElement;
        const isLeftEditor = activeEl === editorLeft;
        const isRightEditor = activeEl === editorRight;
        const currentPane = isLeftEditor ? 'left' : isRightEditor ? 'right' : null;
        
        // Strikethrough with Shift + -
        if (e.shiftKey && e.key === '_') {
          e.preventDefault();
          document.execCommand && document.execCommand('strikethrough');
          return;
        }

        const mod = e.ctrlKey || e.metaKey; // support Cmd on macOS
        if (!mod) return;

        // Bold
        if (e.key.toLowerCase() === 'b') {
          e.preventDefault();
          document.execCommand && document.execCommand('bold');
          return;
        }

        // Highlight
        if (e.key.toLowerCase() === 'h') {
          e.preventDefault();
          highlightSelection();
          return;
        }

        // Bigger (supports both '=' and '+')
        if (e.key === '+' || e.key === '=' ) {
          e.preventDefault();
          setFs(getFs() + 2);
          return;
        }

        // Smaller
        if (e.key === '-') {
          e.preventDefault();
          setFs(getFs() - 2);
          return;
        }

        // Reset font size
        if (e.key === '0') {
          e.preventDefault();
          setFs(18);
          return;
        }

        // Prevent browser Save dialog (content autosaves anyway)
        if (e.key.toLowerCase() === 's') {
          e.preventDefault();
          if (currentPane) saveNow(currentPane);
          return;
        }
      });

      // Save before unload just in case
      window.addEventListener('beforeunload', () => {
        saveNow('left');
        saveNow('right');
      });
    })();
  </script>
</body>
</html>
